<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs under
         16px (the message box, chat composer, etc.). Safari deliberately still
         honors pinch-to-zoom despite it, so accessibility zoom is unaffected. -->
    <!-- maximum-scale removed (S196p): it disabled PINCH-ZOOM, which is an
         accessibility control, and the reason given for it — iOS auto-zooming
         when you focus a small input — only ever applied to iOS and is fixed
         properly by giving inputs a 16px font on small screens (see index.css).
         Android users were losing zoom for an iOS problem. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- ⚠️ THE DISPLAY FONT IS LOADED HERE, NOT FROM CSS (S196j).
         themes.css carried `@import url(...Sora...)`, and the bundler hoisted
         that import into the DEV-ONLY Showcase chunk — which production never
         loads. The shipped CSS went on naming Sora in --font-display while
         nothing ever fetched it, so every heading, hero number and the wordmark
         rendered in the system fallback. Nobody spotted it because the app
         still looked deliberate, just not like the design.
         A <link> also beats @import on speed: an @import inside a stylesheet
         cannot start downloading until that stylesheet has itself arrived. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" />
    <title>Glidna</title>
    <meta name="description" content="Glidna — where skilled trainers and smart AI keep you aware, accountable, and on track. Powerful with a coach, capable on its own." />
    <!-- PWA: installable as a home-screen app (icons via npm run gen:icons). Also
         helps mic/camera permissions persist on iOS when installed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060809" />
    <!-- Appearance (S95). Must run BEFORE first paint, which is why it's inline
         and dependency-free rather than in React: the app would otherwise boot
         dark and visibly flash to light on the first render. Sits AFTER the
         theme-color meta above so it can retag it (the PWA status-bar colour).
         Default "dark" = the app's look since day one, so nobody's appearance
         changes until they pick a theme themselves. Mirrored by applyTheme() in
         App.jsx — keep the two in step. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("glidna-theme") || "dark";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia
            && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "pro" : "light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#060809" : "#f4f7f8");
          // Accent colour (S183q). Same reason as the theme: read from Firestore
          // it would paint brand cyan and repaint on every cold start. "cyan" is
          // the default and sets nothing, so untouched accounts resolve through
          // the CSS fallbacks. Mirrors ACCENTS/applyAccent in App.jsx — keep in
          // step; the six values per accent are contrast-checked per theme.
          var A = {
            ice:     ["#5cc8ff","#53a3cc","#04201f","#1a729e","#5cc8ff","#04201f","92, 200, 255"],
            azure:   ["#7aa2ff","#6987cc","#04201f","#4468ba","#7aa2ff","#04201f","122, 162, 255"],
            magenta: ["#f472b6","#c36295","#04201f","#b3407c","#f472b6","#04201f","244, 114, 182"],
            lime:    ["#b6e34a","#94b644","#04201f","#557508","#b6e34a","#04201f","182, 227, 74"],
            slate:   ["#a8bcc4","#88979d","#04201f","#5e6d74","#a8bcc4","#04201f","168, 188, 196"]
          };
          var v = A[localStorage.getItem("glidna-accent")];
          if (v) {
            var n = ["--u-accent-d","--u-accentfill-d","--u-accentfg-d",
                     "--u-accent-l","--u-accentfill-l","--u-accentfg-l","--u-accentrgb"];
            for (var i = 0; i < n.length; i++) document.documentElement.style.setProperty(n[i], v[i]);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "pro"); // private mode / storage blocked
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` rather than `black-translucent` (S196p): translucent makes iOS
         draw the status bar OVER the app and always in white text, so in Light
         or Auto themes the clock and battery were white on a white header —
         invisible. `default` reserves the strip and lets iOS pick legible
         glyphs for the underlying colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Glidna" />
    <!-- Open Graph / link-preview card (the graphic that unfurls in Messages, WhatsApp, Slack, etc.).
         og.png is generated by scripts/gen-og.mjs (npm run gen:og). Update the absolute URLs below
         if the production domain changes. Per-invite personalized cards layer on later. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Glidna" />
    <meta property="og:title" content="Glidna" />
    <meta property="og:description" content="Where skilled trainers and smart AI keep you aware, accountable, and on track." />
    <meta property="og:url" content="https://glidna.com/" />
    <meta property="og:image" content="https://glidna.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glidna" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glidna" />
    <meta name="twitter:description" content="Where skilled trainers and smart AI keep you aware, accountable, and on track." />
    <meta name="twitter:image" content="https://glidna.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
